name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download LÖVE 0.10.2
        run: |
          wget -q https://github.com/love2d/love/releases/download/0.10.2/love-0.10.2-win32.zip
          unzip -q love-0.10.2-win32.zip -d love-win

      - name: Build .love file
        run: |
          mkdir -p build
          zip -r build/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"

      - name: Build Windows package
        run: |
          mkdir -p build/windows dist
          cp -r love-win/love-0.10.2-win32/* build/windows/
          cat build/windows/love.exe build/bytepath.love > build/windows/bytepath.exe
          rm build/windows/love.exe build/windows/lovec.exe
          mv build/windows/bytepath.exe build/windows/love.exe
          cd build/windows && zip -r ../../dist/bytepath-windows.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-windows
          path: dist/bytepath-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build .love file
        run: |
          mkdir -p build
          zip -r build/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"

      - name: Build Linux package
        run: make linux

      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-linux
          path: dist/bytepath-linux.zip
