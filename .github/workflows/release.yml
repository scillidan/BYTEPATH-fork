name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - run: make lint

  windows:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip wget

      - name: Download LÖVE 0.10.2
        run: |
          wget -q https://github.com/love2d/love/releases/download/0.10.2/love-0.10.2-win-x86.zip
          unzip -q love-0.10.2-win-x86.zip -d love-win

      - name: Build Windows package
        run: |
          mkdir -p build
          zip -r build/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
          mkdir -p build/windows
          cp -r love-win/* build/windows/
          cat build/windows/love.exe build/bytepath.love > build/windows/bytepath.exe
          rm build/windows/love.exe build/windows/lovec.exe
          mv build/windows/bytepath.exe build/windows/love.exe
          cd build/windows && zip -r ../../dist/bytepath-windows.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-windows
          path: dist/bytepath-windows.zip

  linux:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Linux package
        run: make linux

      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-linux
          path: dist/bytepath-linux.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/bytepath-windows/bytepath-windows.zip
            artifacts/bytepath-linux/bytepath-linux.zip
          generate_release_notes: true
