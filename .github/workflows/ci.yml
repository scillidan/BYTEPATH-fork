name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lunarmodules/luacheck@v1
        with:
          args: --codes --ranges .

  build:
    runs-on: ${{ matrix.os }}
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: love
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4

      - name: Determine LÖVE version from tag
        id: love
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-nosteam" ]]; then
            echo "version=0.10.2" >> "$GITHUB_OUTPUT"
            echo "version_dots=0.10.2" >> "$GITHUB_OUTPUT"
            echo "suffix=nosteam" >> "$GITHUB_OUTPUT"
          else
            echo "version=11.5" >> "$GITHUB_OUTPUT"
            echo "version_dots=11.5" >> "$GITHUB_OUTPUT"
            echo "suffix=11.5" >> "$GITHUB_OUTPUT"
          fi

      - name: Package .love
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
        shell: bash

      - name: Build Windows exe
        if: matrix.target == 'windows'
        run: |
          $ver = "${{ steps.love.outputs.version_dots }}"
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/$ver/love-$ver-win64.zip" -OutFile "love-win64.zip"
          Expand-Archive -Path "love-win64.zip" -DestinationPath "love-win64"
          Copy-Item "love-win64/love-$ver-win64/*" -Destination "dist/" -Recurse
          $loveExe = "dist/love.exe"
          $loveFile = "dist/bytepath.love"
          $outputExe = "dist/bytepath.exe"
          cmd /c "copy /b `"$loveExe`" + `"$loveFile`" `"$outputExe`""
          Remove-Item "dist/love.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist/lovec.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist/bytepath.love" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/*" -DestinationPath "bytepath-windows-${{ steps.love.outputs.suffix }}.zip"

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: bytepath-windows-${{ steps.love.outputs.suffix }}
          path: bytepath-windows-${{ steps.love.outputs.suffix }}.zip

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'love'
        with:
          name: bytepath-love-${{ steps.love.outputs.suffix }}
          path: dist/bytepath.love

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Determine LÖVE version from tag
        id: love
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-nosteam" ]]; then
            echo "suffix=nosteam" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=11.5" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: bytepath-*-${{ steps.love.outputs.suffix }}
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
