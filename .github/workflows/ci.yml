name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Run luacheck
        run: make lint

  build-windows:
    runs-on: windows-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
          - branch: dev
            love_version: "11.5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir dist
          # settings.lua only exists on the dev branch; skip paths that are
          # missing on the checked-out ref instead of failing.
          $paths = 'conf.lua','main.lua','globals.lua','utils.lua','GameObject.lua','tree.lua','settings.lua','libraries','objects','rooms','resources' | Where-Object { Test-Path $_ }
          Compress-Archive -Path $paths -DestinationPath dist\bytepath.zip
          Rename-Item dist\bytepath.zip bytepath.love
        shell: pwsh
      - name: Download LOVE
        run: |
          $v = "${{ matrix.love_version }}"
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/$v/love-$v-win64.zip" -OutFile "love-win64.zip"
          Expand-Archive -Path "love-win64.zip" -DestinationPath "love-win64"
      - name: Build Windows exe
        run: |
          $v = "${{ matrix.love_version }}"
          Copy-Item "love-win64\love-$v-win64\*" -Destination "dist\" -Recurse
          $loveExe = "dist\love.exe"
          $loveFile = "dist\bytepath.love"
          $outputExe = "dist\bytepath.exe"
          cmd /c "copy /b `"$loveExe`" + `"$loveFile`" `"$outputExe`""
          Remove-Item "dist\love.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\lovec.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\bytepath.love" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\*" -DestinationPath "bytepath-love${{ matrix.love_version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bytepath-love${{ matrix.love_version }}-windows-x86_64
          path: bytepath-love${{ matrix.love_version }}-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
            format: love
          - branch: dev
            love_version: "11.5"
            format: appimage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua settings.lua libraries objects rooms resources -x "*.git*"
      - name: Build Linux .love bundle (0.10.2)
        if: matrix.format == 'love'
        run: |
          cd dist
          echo '#!/bin/sh' > bytepath.sh
          echo 'if ! command -v love &> /dev/null; then echo "LOVE ${{ matrix.love_version }} is required: https://love2d.org"; exit 1; fi' >> bytepath.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> bytepath.sh
          echo 'love "$SCRIPT_DIR/bytepath.love"' >> bytepath.sh
          chmod +x bytepath.sh
          zip ../bytepath-love${{ matrix.love_version }}-linux-x86_64.zip bytepath.love bytepath.sh
      - name: Build Linux AppImage (11.5)
        if: matrix.format == 'appimage'
        run: |
          wget -q "https://github.com/love2d/love/releases/download/${{ matrix.love_version }}/love-${{ matrix.love_version }}-x86_64.AppImage" -O love.AppImage
          chmod +x love.AppImage
          cd dist
          cat ../love.AppImage bytepath.love > bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage
          chmod +x bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage
          rm bytepath.love
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.format == 'love'
        with:
          name: bytepath-love${{ matrix.love_version }}-linux-x86_64
          path: bytepath-love${{ matrix.love_version }}-linux-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.format == 'appimage'
        with:
          name: bytepath-love${{ matrix.love_version }}-linux-x86_64
          path: dist/bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage

  build-linux-aarch64:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: dev
      - name: Package .love for aarch64
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua settings.lua libraries objects rooms resources -x "*.git*"
      - name: Build aarch64 .love bundle
        run: |
          cd dist
          echo '#!/bin/sh' > bytepath.sh
          echo '# BYTEPATH needs LOVE; look under common names and paths' >> bytepath.sh
          echo 'LOVE_BIN=""' >> bytepath.sh
          echo 'for name in love love-11.5 love-11.4 love-11.3 love-0.10.2; do' >> bytepath.sh
          echo '  if command -v "$name" >/dev/null 2>&1; then LOVE_BIN="$name"; break; fi' >> bytepath.sh
          echo 'done' >> bytepath.sh
          echo 'if [ -z "$LOVE_BIN" ]; then' >> bytepath.sh
          echo '  for dir in /usr/local/bin /usr/bin /snap/bin "$HOME/.local/bin" "$HOME/bin" /opt/love/usr/bin; do' >> bytepath.sh
          echo '    for name in love love-11.5; do' >> bytepath.sh
          echo '      if [ -x "$dir/$name" ]; then LOVE_BIN="$dir/$name"; break 2; fi' >> bytepath.sh
          echo '    done' >> bytepath.sh
          echo '  done' >> bytepath.sh
          echo 'fi' >> bytepath.sh
          echo 'if [ -z "$LOVE_BIN" ]; then' >> bytepath.sh
          echo '  echo "LOVE 11.5 is required but no love executable was found in PATH." >&2' >> bytepath.sh
          echo '  echo "Install it, e.g.:  sudo apt install love" >&2' >> bytepath.sh
          echo '  exit 1' >> bytepath.sh
          echo 'fi' >> bytepath.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> bytepath.sh
          echo 'exec "$LOVE_BIN" "$SCRIPT_DIR/bytepath.love"' >> bytepath.sh
          chmod +x bytepath.sh
          zip ../bytepath-love11.5-linux-aarch64.zip bytepath.love bytepath.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bytepath-love11.5-linux-aarch64
          path: bytepath-love11.5-linux-aarch64.zip

  build-love:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: dev
      - name: Package .love
        run: |
          mkdir -p dist
          zip -r dist/bytepath-love11.5.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua settings.lua libraries objects rooms resources -x "*.git*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bytepath-love11.5-love
          path: dist/bytepath-love11.5.love

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-linux-aarch64, build-love]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          ref: dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            artifacts/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes
