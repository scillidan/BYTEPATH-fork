name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lunarmodules/luacheck@v1
        with:
          args: --codes --ranges .

  build-windows:
    runs-on: windows-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
            suffix: love0.10.2
          - branch: dev
            love_version: "11.5"
            suffix: love11.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir dist
          Compress-Archive -Path conf.lua,main.lua,globals.lua,utils.lua,GameObject.lua,tree.lua,libraries,objects,rooms,resources -DestinationPath dist\bytepath.zip
          Rename-Item dist\bytepath.zip bytepath.love
        shell: pwsh
      - name: Download LÖVE
        run: |
          $v = "${{ matrix.love_version }}"
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/$v/love-$v-win64.zip" -OutFile "love-win64.zip"
          Expand-Archive -Path "love-win64.zip" -DestinationPath "love-win64"
      - name: Build Windows exe
        run: |
          $v = "${{ matrix.love_version }}"
          Copy-Item "love-win64\love-$v-win64\*" -Destination "dist\" -Recurse
          $loveExe = "dist\love.exe"
          $loveFile = "dist\bytepath.love"
          $outputExe = "dist\bytepath.exe"
          cmd /c "copy /b `"$loveExe`" + `"$loveFile`" `"$outputExe`""
          Remove-Item "dist\love.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\lovec.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\bytepath.love" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\*" -DestinationPath "bytepath-windows-${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-windows-${{ matrix.suffix }}
          path: bytepath-windows-${{ matrix.suffix }}.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
            suffix: love0.10.2
          - branch: dev
            love_version: "11.5"
            suffix: love11.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
      - name: Download LÖVE AppImage
        run: |
          wget -q "https://github.com/love2d/love/releases/download/${{ matrix.love_version }}/love-${{ matrix.love_version }}-x86_64.AppImage" -O love.AppImage
          chmod +x love.AppImage
      - name: Build Linux AppImage
        run: |
          cd dist
          cat ../love.AppImage bytepath.love > bytepath.AppImage
          chmod +x bytepath.AppImage
          rm bytepath.love
          zip ../bytepath-linux-${{ matrix.suffix }}.zip bytepath.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-linux-${{ matrix.suffix }}
          path: bytepath-linux-${{ matrix.suffix }}.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
