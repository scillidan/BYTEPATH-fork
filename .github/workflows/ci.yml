name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
      - name: Run luacheck
        run: make lint

  build-windows:
    runs-on: windows-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
          - branch: dev
            love_version: "11.5"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir dist
          Compress-Archive -Path conf.lua,main.lua,globals.lua,utils.lua,GameObject.lua,tree.lua,libraries,objects,rooms,resources -DestinationPath dist\bytepath.zip
          Rename-Item dist\bytepath.zip bytepath.love
        shell: pwsh
      - name: Download LOVE
        run: |
          $v = "${{ matrix.love_version }}"
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/$v/love-$v-win64.zip" -OutFile "love-win64.zip"
          Expand-Archive -Path "love-win64.zip" -DestinationPath "love-win64"
      - name: Build Windows exe
        run: |
          $v = "${{ matrix.love_version }}"
          Copy-Item "love-win64\love-$v-win64\*" -Destination "dist\" -Recurse
          $loveExe = "dist\love.exe"
          $loveFile = "dist\bytepath.love"
          $outputExe = "dist\bytepath.exe"
          cmd /c "copy /b `"$loveExe`" + `"$loveFile`" `"$outputExe`""
          Remove-Item "dist\love.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\lovec.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist\bytepath.love" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist\*" -DestinationPath "bytepath-love${{ matrix.love_version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bytepath-love${{ matrix.love_version }}-windows-x86_64
          path: bytepath-love${{ matrix.love_version }}-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    strategy:
      matrix:
        include:
          - branch: master
            love_version: "0.10.2"
            format: love
          - branch: dev
            love_version: "11.5"
            format: appimage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
      - name: Package .love
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
      - name: Build Linux .love bundle (0.10.2)
        if: matrix.format == 'love'
        run: |
          cd dist
          echo '#!/bin/sh' > bytepath.sh
          echo 'if ! command -v love &> /dev/null; then echo "LOVE ${{ matrix.love_version }} is required: https://love2d.org"; exit 1; fi' >> bytepath.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> bytepath.sh
          echo 'love "$SCRIPT_DIR/bytepath.love"' >> bytepath.sh
          chmod +x bytepath.sh
          zip ../bytepath-love${{ matrix.love_version }}-linux-x86_64.zip bytepath.love bytepath.sh
      - name: Build Linux AppImage (11.5)
        if: matrix.format == 'appimage'
        run: |
          wget -q "https://github.com/love2d/love/releases/download/${{ matrix.love_version }}/love-${{ matrix.love_version }}-x86_64.AppImage" -O love.AppImage
          chmod +x love.AppImage
          cd dist
          cat ../love.AppImage bytepath.love > bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage
          chmod +x bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage
          rm bytepath.love
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.format == 'love'
        with:
          name: bytepath-love${{ matrix.love_version }}-linux-x86_64
          path: bytepath-love${{ matrix.love_version }}-linux-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.format == 'appimage'
        with:
          name: bytepath-love${{ matrix.love_version }}-linux-x86_64
          path: dist/bytepath-love${{ matrix.love_version }}-linux-x86_64.AppImage

  build-linux-aarch64:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false
          ref: dev
      - name: Package .love for aarch64
        run: |
          mkdir -p dist
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
      - name: Build aarch64 .love bundle
        run: |
          cd dist
          echo '#!/bin/sh' > bytepath.sh
          echo 'if ! command -v love &> /dev/null; then echo "LOVE 11.5 is required: https://love2d.org"; exit 1; fi' >> bytepath.sh
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> bytepath.sh
          echo 'love "$SCRIPT_DIR/bytepath.love"' >> bytepath.sh
          chmod +x bytepath.sh
          zip ../bytepath-love11.5-linux-aarch64.zip bytepath.love bytepath.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bytepath-love11.5-linux-aarch64
          path: bytepath-love11.5-linux-aarch64.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-linux-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            artifacts/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes
