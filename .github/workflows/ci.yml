name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lunarmodules/luacheck@v1
        with:
          args: --codes --ranges .

  build-love:
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Package .love
        run: |
          mkdir -p dist
          cd $GITHUB_WORKSPACE
          zip -r dist/bytepath.love conf.lua main.lua globals.lua utils.lua GameObject.lua tree.lua libraries objects rooms resources -x "*.git*"
      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-love
          path: dist/bytepath.love

  build-windows:
    runs-on: windows-latest
    needs: build-love
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bytepath-love
          path: dist
      - name: Download LÖVE
        run: |
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip" -OutFile "love-win64.zip"
          Expand-Archive -Path "love-win64.zip" -DestinationPath "love-win64"
      - name: Build Windows exe
        run: |
          Copy-Item "love-win64/love-11.5-win64/*" -Destination "dist/" -Recurse
          $loveExe = "dist/love.exe"
          $loveFile = "dist/bytepath.love"
          $outputExe = "dist/bytepath.exe"
          cmd /c "copy /b `"$loveExe`" + `"$loveFile`" `"$outputExe`""
          Remove-Item "dist/love.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist/lovec.exe" -ErrorAction SilentlyContinue
          Remove-Item "dist/bytepath.love" -ErrorAction SilentlyContinue
      - name: Zip Windows build
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "bytepath-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bytepath-windows
          path: bytepath-windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-love, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bytepath-love
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: bytepath-windows
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/bytepath.love
            artifacts/bytepath-windows.zip
